name: Set up zizmor
description: Installs a checksum-verified zizmor binary into /usr/local/bin.
runs:
  using: composite
  steps:
    # Pinned by version AND by the SHA-256 GitHub records for the release asset (the release is
    # immutable, so the asset cannot be replaced under the same tag). Bump both together.
    - name: Install zizmor
      shell: bash
      env:
        ZIZMOR_VERSION: "1.30.1"
        ZIZMOR_SHA256: "e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a"
      run: |
        dir="$RUNNER_TEMP/zizmor"
        mkdir -p "$dir"
        cd "$dir"
        tarball="zizmor-x86_64-unknown-linux-gnu.tar.gz"
        curl -fsSL --retry 3 --retry-all-errors -o "$tarball" "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/${tarball}"
        echo "${ZIZMOR_SHA256}  ${tarball}" | sha256sum -c -
        tar -xzf "$tarball"
        bin="$(find "$dir" -type f -name zizmor | head -n 1)"
        test -n "$bin" || { echo "::error::no zizmor binary in ${tarball}"; exit 1; }
        sudo install -m 0755 "$bin" /usr/local/bin/zizmor
